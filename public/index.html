<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>TsOrbit — Server Running</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blood: #8b0000;
        --blood-hot: #c41e3a;
        --ash: #0a0707;
        --fog: #1a1010;
        --bone: #e8dcc8;
        --muted: #8a7570;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: "Special Elite", monospace;
        color: var(--bone);
        background:
          radial-gradient(ellipse 90% 60% at 50% -10%, #3a0a0a 0%, transparent 55%),
          radial-gradient(ellipse 50% 40% at 80% 100%, #1a0505 0%, transparent 50%),
          linear-gradient(180deg, var(--fog) 0%, var(--ash) 100%);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
        opacity: 0.12;
        mix-blend-mode: overlay;
        z-index: 1;
      }

      .bleed {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(139, 0, 0, 0.35) 0%, transparent 18%),
          linear-gradient(0deg, rgba(0, 0, 0, 0.75) 0%, transparent 28%);
        z-index: 2;
      }

      main {
        position: relative;
        z-index: 3;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
        text-align: center;
      }

      .brand {
        font-family: "Creepster", cursive;
        font-size: clamp(2.8rem, 10vw, 5.5rem);
        letter-spacing: 0.04em;
        color: var(--blood-hot);
        text-shadow:
          0 0 18px rgba(196, 30, 58, 0.55),
          2px 3px 0 #2a0000,
          0 0 60px rgba(139, 0, 0, 0.35);
        animation: twitch 4.5s ease-in-out infinite;
      }

      .status {
        margin-top: 1.25rem;
        font-size: clamp(1.35rem, 4.5vw, 2.1rem);
        color: var(--bone);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .pulse {
        display: inline-block;
        width: 0.55em;
        height: 0.55em;
        margin-right: 0.45em;
        border-radius: 50%;
        background: var(--blood-hot);
        box-shadow: 0 0 12px var(--blood-hot);
        animation: heartbeat 1.4s ease-in-out infinite;
        vertical-align: middle;
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        15% {
          transform: scale(1.35);
          opacity: 0.85;
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.2);
        }
      }

      @keyframes twitch {
        0%,
        92%,
        100% {
          transform: translate(0, 0) skewX(0);
          filter: none;
        }
        93% {
          transform: translate(-2px, 1px) skewX(-2deg);
          filter: hue-rotate(-10deg);
        }
        95% {
          transform: translate(2px, -1px) skewX(1deg);
        }
        97% {
          transform: translate(-1px, 0) skewX(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="bleed" aria-hidden="true"></div>
    <main>
      <h1 class="brand">TsOrbit</h1>
      <p class="status">
        <span class="pulse" aria-hidden="true"></span>Server running
      </p>
    </main>
  </body>
</html>
