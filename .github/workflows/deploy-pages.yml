name: Deploy Cloudflare Pages bridge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Pages env (ORIGIN = VPS IP only in Cloudflare)
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VPS_ORIGIN: ${{ secrets.VPS_ORIGIN }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "${VPS_ORIGIN:-}" ] || [ -z "${BRIDGE_SECRET:-}" ]; then
            echo "Missing VPS_ORIGIN or BRIDGE_SECRET GitHub secrets"
            exit 1
          fi
          BODY=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "deployment_configs": {
              "production": {
                "env_vars": {
                  "ORIGIN": {"type": "plain_text", "value": os.environ["VPS_ORIGIN"]},
                  "BRIDGE_SECRET": {"type": "secret_text", "value": os.environ["BRIDGE_SECRET"]},
                  "API_TOKEN": {"type": "secret_text", "value": os.environ["BRIDGE_SECRET"]},
                }
              },
              "preview": {
                "env_vars": {
                  "ORIGIN": {"type": "plain_text", "value": os.environ["VPS_ORIGIN"]},
                  "BRIDGE_SECRET": {"type": "secret_text", "value": os.environ["BRIDGE_SECRET"]},
                  "API_TOKEN": {"type": "secret_text", "value": os.environ["BRIDGE_SECRET"]},
                }
              }
            }
          }))
          PY
          )
          RESP=$(curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/coinstsorbit" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('ok', d.get('success'), d.get('errors')); raise SystemExit(0 if d.get('success') else 1)"

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=coinstsorbit --branch=main
