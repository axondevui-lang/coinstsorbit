name: Setup stable CF Worker bridge

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm i -g wrangler@4

      - name: List zones and account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "Account: $CLOUDFLARE_ACCOUNT_ID"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            | tee /tmp/zones.json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success', d.get('success'));
print('\\n'.join(f\"{z['name']} {z['id']}\" for z in d.get('result',[])))"

      - name: Deploy Worker proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VPS_ORIGIN: ${{ secrets.VPS_ORIGIN }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          set -e
          mkdir -p worker-bridge
          cat > worker-bridge/wrangler.toml <<EOF
          name = "tsorbit-api-bridge"
          main = "src/index.js"
          compatibility_date = "2024-11-01"
          account_id = "${CLOUDFLARE_ACCOUNT_ID}"
          workers_dev = true

          [vars]
          ORIGIN = "${VPS_ORIGIN}"
          BRIDGE_SECRET = "${BRIDGE_SECRET}"
          EOF
          mkdir -p worker-bridge/src
          cat > worker-bridge/src/index.js <<'EOF'
          export default {
            async fetch(request, env) {
              if (request.method === 'OPTIONS') {
                return new Response(null, {
                  status: 204,
                  headers: {
                    'Access-Control-Allow-Origin': '*',
                    'Access-Control-Allow-Methods': 'GET,POST,OPTIONS',
                    'Access-Control-Allow-Headers': 'Content-Type, Authorization, X-Api-Token, X-Bridge-Secret',
                    'Access-Control-Max-Age': '86400',
                  },
                });
              }
              const origin = (env.ORIGIN || '').replace(/\/$/, '');
              const token = env.BRIDGE_SECRET || env.API_TOKEN || '';
              if (!origin) {
                return Response.json({ ok: false, error: 'ORIGIN missing' }, { status: 500 });
              }
              const url = new URL(request.url);
              const target = origin + url.pathname + url.search;
              const headers = new Headers();
              const ct = request.headers.get('Content-Type');
              if (ct) headers.set('Content-Type', ct);
              if (token) {
                headers.set('Authorization', 'Bearer ' + token);
                headers.set('X-Api-Token', token);
                headers.set('X-Bridge-Secret', token);
              }
              headers.set('Accept', request.headers.get('Accept') || '*/*');
              const init = { method: request.method, headers, redirect: 'manual' };
              if (request.method !== 'GET' && request.method !== 'HEAD') {
                init.body = await request.arrayBuffer();
              }
              let upstream;
              try {
                upstream = await fetch(target, init);
              } catch (e) {
                return Response.json({ ok: false, error: 'Origen no disponible', detail: String(e) }, {
                  status: 502,
                  headers: { 'Access-Control-Allow-Origin': '*' },
                });
              }
              const out = new Headers(upstream.headers);
              out.set('Access-Control-Allow-Origin', '*');
              return new Response(upstream.body, { status: upstream.status, headers: out });
            },
          };
          EOF
          cd worker-bridge
          npx wrangler deploy
          npx wrangler deployments list 2>/dev/null | head -20 || true
